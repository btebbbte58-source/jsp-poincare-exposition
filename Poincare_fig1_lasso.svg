<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Georgia, serif">
<rect width="680" height="360" fill="#ffffff"/>
<text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">The lasso test: simply connected or not?</text>
<circle cx="170" cy="200" r="95" fill="#dceaf7" stroke="#2b5f8a" stroke-width="2.5"/>
<ellipse cx="170" cy="200" rx="95" ry="95" fill="none" stroke="#7fa8c9" stroke-width="1.2"/>
<ellipse cx="170" cy="200" rx="52" ry="95" fill="none" stroke="#7fa8c9" stroke-width="1.2"/>
<ellipse cx="170" cy="200" rx="95" ry="33" fill="none" stroke="#7fa8c9" stroke-width="1.2"/>
<ellipse cx="170" cy="133" rx="34" ry="12" fill="none" stroke="#2e8b57" stroke-width="3"/>
<line x1="210" y1="133" x2="232" y2="133" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<ellipse cx="246" cy="133" rx="14" ry="6" fill="none" stroke="#2e8b57" stroke-width="3"/>
<line x1="266" y1="133" x2="286" y2="133" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
<circle cx="298" cy="133" r="5" fill="#2e8b57"/>
<text x="170" y="340" text-anchor="middle" font-size="16" fill="#2e8b57" font-weight="bold">sphere: every loop shrinks to a point  &#10003;</text>
<text x="170" y="66" text-anchor="middle" font-size="15" fill="#2b5f8a">simply connected</text>
<ellipse cx="500" cy="200" rx="100" ry="62" fill="#f7e3ce" stroke="#a05f2c" stroke-width="2.5"/>
<ellipse cx="500" cy="200" rx="26" ry="14" fill="#ffffff" stroke="#a05f2c" stroke-width="2"/>
<ellipse cx="500" cy="200" rx="16" ry="46" fill="none" stroke="#c0392b" stroke-width="3.2"/>
<text x="522" y="278" font-size="15" fill="#c0392b">loop threaded through the hole</text>
<text x="500" y="307" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">torus: this loop can never shrink  &#10007;</text>
<text x="500" y="66" text-anchor="middle" font-size="15" fill="#a05f2c">has a hole &#8212; not simply connected</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#555"/></marker></defs>
</svg>